name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        uses: bahmutov/npm-install@v1

      - name: Build project
        run: npm run build
        env:
          VITE_HOST: ${{ vars.VITE_HOST }}
          VITE_TWITCH_CLIENT_ID: ${{ vars.VITE_TWITCH_CLIENT_ID }}
          VITE_TWITCH_CLIENT_URL: ${{ vars.VITE_TWITCH_CLIENT_URL }}

      - name: Deploy via rsync over SSH
        run: |
          sudo apt-get install -y -q sshpass
          sshpass -e rsync -az --exclude 'output/' \
            -e "ssh -o StrictHostKeyChecking=no -p 22" \
            dist/ "$FTP_USERNAME@$FTP_SERVER:$FTP_SERVER_DIR"
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
